name: validate-model

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regenerate synthetic data
        run: python src/generate_data.py
      - name: Validate TMDL references and compute reference KPIs
        run: python src/validate_model.py
      - name: Unit tests
        run: pytest -q
